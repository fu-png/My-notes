# MyNotes 统一入口 — Nginx 反向代理
# 同一台服务器上同时代理前端和后端
#
# 路由规则:
#   /api/*    → 后端 API (Fastify :4000)
#   /health   → Nginx 直接返回
#   其他所有   → 前端 (Next.js :3000)

# 限流：每个 IP 每秒 30 个请求
limit_req_zone $binary_remote_addr zone=global_limit:10m rate=30r/s;

upstream frontend {
    server web:3000;
}

upstream backend {
    server api:4000;
}

server {
    listen 80;
    server_name _;

    # 安全头
    add_header X-Content-Type-Options    "nosniff"     always;
    add_header X-Frame-Options           "DENY"        always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # 健康检查（Nginx 直接返回）
    location = /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # 后端 API — 直接代理到 Fastify（跳过 Next.js 代理层，减少一跳）
    # 前端 /api/auth/* 等路由仍走 Next.js（因为需要设置 cookie）
    location ~ ^/api/auth/ {
        limit_req zone=global_limit burst=20 nodelay;

        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其他 /api/* 走 Next.js 代理层（api-proxy.ts 处理 token 注入）
    location /api/ {
        limit_req zone=global_limit burst=40 nodelay;

        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持
        proxy_set_header Connection        '';
        proxy_buffering  off;
        proxy_cache      off;
        chunked_transfer_encoding on;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;

        client_max_body_size 50m;
    }

    # 前端页面 — 所有其他请求走 Next.js
    location / {
        limit_req zone=global_limit burst=60 nodelay;

        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    # Next.js 静态资源（长缓存）
    location /_next/static/ {
        proxy_pass http://frontend;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
